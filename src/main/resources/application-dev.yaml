server:
  port: 8080
spring:
  datasource:
    url: ${PHARMASOFT_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${PHARMASOFT_DB_USERNAME:PHARMASOFT_DEV}
    password: ${PHARMASOFT_DB_PASSWORD:oracle123}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # El esquema lo crea Flyway (db/migration); Hibernate solo valida
      # que las entidades coincidan con lo que hay en la base.
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Historial exclusivo del esquema de PharmaSoft, nunca el TESTDB compartido.
    default-schema: ${PHARMASOFT_DB_USERNAME:PHARMASOFT_DEV}
    baseline-on-migrate: false
    clean-disabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

# Trazabilidad en desarrollo: se quiere ver el detalle de las
# consultas y de los parametros que llegan a cada servicio.
logging:
  level:
    root: INFO
    pe.edu.upeu.PharmaBackend: DEBUG
    pe.edu.upeu.PharmaBackend.service.impl: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# Origenes del frontend autorizados a consumir /api/** en desarrollo.
# Se declaran uno por uno: nunca el comodin "*".
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200
  # Clave HMAC del JWT en Base64 (minimo 256 bits). Solo para desarrollo.
  jwt:
    secret: ILPEwcQMZU9TnjpXzv/hRWNoC9n1Imz+nPTBwMZH7TBX9n7f7XagfIgD7LhCEFZNclj1zxfx9FbVvbpfH45HOA==
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}
